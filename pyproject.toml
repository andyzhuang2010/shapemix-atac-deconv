[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shapemix-atac"
version = "0.1.0"
description = "Reference-based ATAC deconvolution with fragment-length signatures"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=1.5", "torch>=2.11,<2.12"]

[project.optional-dependencies]
anndata = ["anndata>=0.9"]
test = ["pytest>=7", "anndata>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
